# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - nem

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip app.py requirements.txt static \
            dec_scaler_i8_*.joblib \
            dem_scaler_i8_*.joblib \
            enc_scaler_i8_*.joblib \
            rrp_scaler_i8_*.joblib \
            transformer_model_i8_small_*.keras \
            -x "venv/*" "__pycache__/*" "*.pyc"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_79B698E2A2BC4D52BEBE2434283E0322 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E1ABC583BA4A47BEBA9572A7A1FEFDD6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5E13D6F5BA0C44F09E7CBBDC30B1AC14 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: nem
          package: release.zip

          